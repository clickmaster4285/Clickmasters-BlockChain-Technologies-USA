<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121b30"/><stop offset="1" stop-color="#0a1020"/>
  </linearGradient>
  <radialGradient id="glowBg" cx="0.78" cy="0.2" r="0.6">
    <stop offset="0" stop-color="#F5A524" stop-opacity="0.13"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F5A524" flood-opacity="0.28"/>
  </filter>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker><marker id="ahS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker><marker id="ahMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8BF"/></marker><marker id="ahMutedS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8BF"/></marker><marker id="ahRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="ahRedS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="ahGreenS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bgGrad)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<rect width="1600" height="900" fill="url(#glowBg)"/>
<rect x="0" y="0" width="1600" height="6" fill="#F5A524"/>
<text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="3"><tspan x="80" y="72.0">BLOCKCHAIN ORACLE INTEGRATION</tspan></text>
<text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="80" y="122.0">Example: a flight-delay insurance oracle workflow</tspan></text>

<line x1="215" y1="256" x2="215" y2="782" stroke="#2c3a5a" stroke-width="2" stroke-dasharray="6 6"/><rect x="90" y="180" width="250" height="76" rx="14" fill="#1f2033" stroke="#F5A524" stroke-width="2" filter="url(#glow)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="215" y="208.8">Policy contract</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="215" y="237.8">Holds premiums</tspan></text><line x1="605" y1="256" x2="605" y2="782" stroke="#2c3a5a" stroke-width="2" stroke-dasharray="6 6"/><rect x="480" y="180" width="250" height="76" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="605" y="208.8">Oracle workflow</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="605" y="237.8">Off-chain nodes</tspan></text><line x1="995" y1="256" x2="995" y2="782" stroke="#2c3a5a" stroke-width="2" stroke-dasharray="6 6"/><rect x="870" y="180" width="250" height="76" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="995" y="208.8">Flight API A</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="995" y="237.8">Data provider</tspan></text><line x1="1385" y1="256" x2="1385" y2="782" stroke="#2c3a5a" stroke-width="2" stroke-dasharray="6 6"/><rect x="1260" y="180" width="250" height="76" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1385" y="208.8">Flight API B</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="1385" y="237.8">Second provider</tspan></text><path d="M223,306 L597,306" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="middle"><tspan x="410" y="294.0">Scheduled arrival passed: request status</tspan></text><path d="M613,368 L987,368" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="middle"><tspan x="800" y="356.0">Query flight status</tspan></text><path d="M613,430 L1377,430" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="middle"><tspan x="995" y="418.0">Query flight status</tspan></text><path d="M987,492 L613,492" stroke="#9AA8BF" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ahMuted)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="middle"><tspan x="800" y="480.0">Delayed 3h 10m</tspan></text><path d="M1377,554 L613,554" stroke="#9AA8BF" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ahMuted)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="middle"><tspan x="995" y="542.0">Delayed 3h 05m</tspan></text><rect x="599" y="596" width="12" height="34" rx="3" fill="#F5A524" opacity="0.8"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="start"><tspan x="627" y="620.0">Both agree: delay over threshold</tspan></text><path d="M597,678 L223,678" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#F1F5F9" text-anchor="middle"><tspan x="410" y="666.0">Deliver signed result on-chain</tspan></text><rect x="209" y="720" width="12" height="34" rx="3" fill="#F5A524" opacity="0.8"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#34D399" text-anchor="start"><tspan x="237" y="744.0">Pays the policyholder automatically</tspan></text><rect x="80" y="780" width="1440" height="50" rx="12" fill="#1d1a2a" stroke="rgba(248,113,113,0.5)" stroke-width="1.5" stroke-dasharray="6 5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#F87171" text-anchor="start"><tspan x="104" y="812.0">If the APIs disagree or don't respond</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#F1F5F9" text-anchor="start"><tspan x="420" y="812.0">→  the claim moves to manual or dispute-based review instead of paying out or rejecting blindly</tspan></text>
<g opacity="0.75">
  <rect x="1368" y="850" width="10" height="10" rx="2" fill="#F5A524"/>
  <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="1386" y="860.0">ClickMasters</tspan></text>
  <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="1485" y="860.0">Blockchain</tspan></text>
</g>
</svg>