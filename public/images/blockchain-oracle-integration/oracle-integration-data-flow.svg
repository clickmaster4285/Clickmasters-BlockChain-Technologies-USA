ill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="382.28571428571433" y="430.0">Oracle node</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="382.28571428571433" y="458.8">Fetches data and</tspan><tspan x="382.28571428571433" y="479.0">signs reports</tspan></text><circle cx="382.28571428571433" cy="330" r="26" fill="#F5A524" opacity="0.15"/><circle cx="382.28571428571433" cy="330" r="20" fill="#121b30" stroke="#F5A524" stroke-width="2.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#F1F5F9" text-anchor="middle"><tspan x="382.28571428571433" y="337.2">02</tspan></text><path d="M476.7142857142858,450 L496.7142857142858,450" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="497.7142857142857" y="330" width="186.85714285714286" height="240" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="591.1428571428571" y="408.0">Retrieval &amp;</tspan><tspan x="591.1428571428571" y="431.8">validation</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="591.1428571428571" y="460.5">Format checks,</tspan><tspan x="591.1428571428571" y="480.8">outliers,</tspan><tspan x="591.1428571428571" y="501.0">signatures</tspan></text><circle cx="591.1428571428571" cy="330" r="26" fill="#F5A524" opacity="0.15"/><circle cx="591.1428571428571" cy="330" r="20" fill="#121b30" stroke="#F5A524" stroke-width="2.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#F1F5F9" text-anchor="middle"><tspan x="591.1428571428571" y="337.2">03</tspan></text><path d="M685.5714285714286,450 L705.5714285714286,450" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="706.5714285714286" y="330" width="186.85714285714286" height="240" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="800" y="419.9">Aggregation</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="800" y="448.6">Median, weighting</tspan><tspan x="800" y="468.9">or optimistic</tspan><tspan x="800" y="489.1">assertion</tspan></text><circle cx="800" cy="330" r="26" fill="#F5A524" opacity="0.15"/><circle cx="800" cy="330" r="20" fill="#121b30" stroke="#F5A524" stroke-width="2.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#F1F5F9" text-anchor="middle"><tspan x="800" y="337.2">04</tspan></text><path d="M894.4285714285714,450 L914.4285714285714,450" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="915.4285714285714" y="330" width="186.85714285714286" height="240" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1008.8571428571429" y="419.9">Oracle contract</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="1008.8571428571429" y="448.6">Stores value (push)</tspan><tspan x="1008.8571428571429" y="468.9">or verifies update</tspan><tspan x="1008.8571428571429" y="489.1">(pull)</tspan></text><circle cx="1008.8571428571429" cy="330" r="26" fill="#F5A524" opacity="0.15"/><circle cx="1008.8571428571429" cy="330" r="20" fill="#121b30" stroke="#F5A524" stroke-width="2.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#F1F5F9" text-anchor="middle"><tspan x="1008.8571428571429" y="337.2">05</tspan></text><path d="M1103.2857142857142,450 L1123.2857142857142,450" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="1124.2857142857142" y="330" width="186.85714285714286" height="240" rx="14" fill="#1f2033" stroke="#F5A524" stroke-width="2" filter="url(#glow)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1217.7142857142856" y="408.0">Consumer</tspan><tspan x="1217.7142857142856" y="431.8">contract</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="1217.7142857142856" y="460.5">Re-checks</tspan><tspan x="1217.7142857142856" y="480.8">staleness, bounds,</tspan><tspan x="1217.7142857142856" y="501.0">decimals</tspan></text><circle cx="1217.7142857142856" cy="330" r="26" fill="#F5A524" opacity="0.15"/><circle cx="1217.7142857142856" cy="330" r="20" fill="#121b30" stroke="#F5A524" stroke-width="2.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#F1F5F9" text-anchor="middle"><tspan x="1217.7142857142856" y="337.2">06</tspan></text><path d="M1312.142857142857,450 L1332.142857142857,450" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="1333.142857142857" y="330" width="186.85714285714286" height="240" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1426.5714285714284" y="419.9">Execution</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="1426.5714285714284" y="448.6">Liquidate, settle,</tspan><tspan x="1426.5714285714284" y="468.9">mint, pay out or</tspan><tspan x="1426.5714285714284" y="489.1">pause</tspan></text><circle cx="1426.5714285714284" cy="330" r="26" fill="#F5A524" opacity="0.15"/><circle cx="1426.5714285714284" cy="330" r="20" fill="#121b30" stroke="#F5A524" stroke-width="2.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#F1F5F9" text-anchor="middle"><tspan x="1426.5714285714284" y="337.2">07</tspan></text><rect x="80" y="690" width="470" height="80" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F5A524" text-anchor="start"><tspan x="102" y="738.0">Push</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="210" y="738.0">Steps 1–5 run continuously; your</tspan><tspan x="210" y="757.8">contract only reads</tspan></text><rect x="566" y="690" width="470" height="80" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F5A524" text-anchor="start"><tspan x="588" y="738.0">Pull</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="696" y="738.0">Step 5 happens inside the user's</tspan><tspan x="696" y="757.8">transaction</tspan></text><rect x="1052" y="690" width="470" height="80" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F5A524" text-anchor="start"><tspan x="1074" y="738.0">Optimistic</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="1182" y="738.0">Value is final only after a dispute</tspan><tspan x="1182" y="757.8">window</tspan></text>
