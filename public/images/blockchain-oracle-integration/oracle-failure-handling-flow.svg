  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker><marker id="ahS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker><marker id="ahMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8BF"/></marker><marker id="ahMutedS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8BF"/></marker><marker id="ahRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="ahRedS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="ahGreenS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bgGrad)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<rect width="1600" height="900" fill="url(#glowBg)"/>
<rect x="0" y="0" width="1600" height="6" fill="#F5A524"/>
<text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="3"><tspan x="80" y="72.0">BLOCKCHAIN ORACLE INTEGRATION</tspan></text>
<text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="80" y="122.0">How a contract handles bad oracle data</tspan></text>

<rect x="80" y="220" width="256" height="220" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F5A524" text-anchor="middle" letter-spacing="2"><tspan x="208" y="306.5">CHECK 1</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="208" y="334.5">Is the L2 sequencer</tspan><tspan x="208" y="358.3">up, with the grace</tspan><tspan x="208" y="382.0">period passed?</tspan></text><path d="M338,330 L374,330" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#ahGreen)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#34D399" text-anchor="middle"><tspan x="356" y="318.0">Yes</tspan></text><path d="M208,442 L208,576" stroke="#F87171" stroke-width="2.5" fill="none" marker-end="url(#ahRed)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#F87171" text-anchor="middle"><tspan x="232" y="513.0">No</tspan></text><rect x="80" y="580" width="256" height="190" rx="14" fill="#1d1a2a" stroke="rgba(248,113,113,0.55)" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="208" y="611.3">Revert</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="208" y="638.9">Prices may be stale while the</tspan><tspan x="208" y="658.5">sequencer recovers</tspan></text><rect x="376" y="220" width="256" height="220" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F5A524" text-anchor="middle" letter-spacing="2"><tspan x="504" y="306.5">CHECK 2</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="504" y="334.5">Is the price fresh</tspan><tspan x="504" y="358.3">(age within the feed's</tspan><tspan x="504" y="382.0">heartbeat)?</tspan></text><path d="M634,330 L670,330" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#ahGreen)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#34D399" text-anchor="middle"><tspan x="652" y="318.0">Yes</tspan></text><path d="M504,442 L504,576" stroke="#F87171" stroke-width="2.5" fill="none" marker-end="url(#ahRed)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#F87171" text-anchor="middle"><tspan x="528" y="513.0">No</tspan></text><rect x="376" y="580" width="256" height="190" rx="14" fill="#1d1a2a" stroke="rgba(248,113,113,0.55)" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="504" y="611.3">Pause risky actions</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="504" y="638.9">Block new borrows and</tspan><tspan x="504" y="658.5">liquidations; keep repay and</tspan><tspan x="504" y="678.0">withdraw open</tspan></text><rect x="672" y="220" width="256" height="220" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F5A524" text-anchor="middle" letter-spacing="2"><tspan x="800" y="306.5">CHECK 3</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="800" y="334.5">Is the value above</tspan><tspan x="800" y="358.3">zero and inside sanity</tspan><tspan x="800" y="382.0">bounds?</tspan></text><path d="M930,330 L966,330" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#ahGreen)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#34D399" text-anchor="middle"><tspan x="948" y="318.0">Yes</tspan></text><path d="M800,442 L800,576" stroke="#F87171" stroke-width="2.5" fill="none" marker-end="url(#ahRed)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#F87171" text-anchor="middle"><tspan x="824" y="513.0">No</tspan></text><rect x="672" y="580" width="256" height="190" rx="14" fill="#1d1a2a" stroke="rgba(248,113,113,0.55)" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="800" y="611.3">Reject the value</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="800" y="638.9">Circuit breaker trips and</tspan><tspan x="800" y="658.5">alerts the owner</tspan></text><rect x="968" y="220" width="256" height="220" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F5A524" text-anchor="middle" letter-spacing="2"><tspan x="1096" y="294.6">CHECK 4</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1096" y="322.6">Do primary and</tspan><tspan x="1096" y="346.4">secondary sources</tspan><tspan x="1096" y="370.1">agree within the</tspan><tspan x="1096" y="393.9">deviation limit?</tspan></text><path d="M1226,330 L1262,330" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#ahGreen)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#34D399" text-anchor="middle"><tspan x="1244" y="318.0">Yes</tspan></text><path d="M1096,442 L1096,576" stroke="#F87171" stroke-width="2.5" fill="none" marker-end="url(#ahRed)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#F87171" text-anchor="middle"><tspan x="1120" y="513.0">No</tspan></text><rect x="968" y="580" width="256" height="190" rx="14" fill="#1d1a2a" stroke="rgba(248,113,113,0.55)" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1096" y="611.3">Switch to fallback or</tspan><tspan x="1096" y="633.8">pause</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="1096" y="661.4">Recovery through a timelocked</tspan><tspan x="1096" y="681.0">multisig</tspan></text><rect x="1264" y="220" width="256" height="550" rx="14" fill="#1f2033" stroke="#F5A524" stroke-width="2" filter="url(#glow)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F5A524" text-anchor="middle" letter-spacing="2"><tspan x="1392" y="446.8">ALL CHECKS PASS</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#F1F5F9" text-anchor="middle"><tspan x="1392" y="474.8">Use the price and</tspan><tspan x="1392" y="502.3">execute</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9AA8BF" text-anchor="middle"><tspan x="1392" y="534.7">Liquidate, settle, mint or</tspan><tspan x="1392" y="555.6">pay out with validated</tspan><tspan x="1392" y="576.6">data</tspan></text>
<g opacity="0.75">
  <rect x="1368" y="850" width="10" height="10" rx="2" fill="#F5A524"/>
  <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="1386" y="860.0">ClickMasters</tspan></text>
  <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="1485" y="860.0">Blockchain</tspan></text>
</g>
