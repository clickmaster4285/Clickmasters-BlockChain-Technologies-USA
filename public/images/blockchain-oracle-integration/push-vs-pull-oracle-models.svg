<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121b30"/><stop offset="1" stop-color="#0a1020"/>
  </linearGradient>
  <radialGradient id="glowBg" cx="0.78" cy="0.2" r="0.6">
    <stop offset="0" stop-color="#F5A524" stop-opacity="0.13"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F5A524" flood-opacity="0.28"/>
  </filter>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker><marker id="ahS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker><marker id="ahMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8BF"/></marker><marker id="ahMutedS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8BF"/></marker><marker id="ahRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="ahRedS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="ahGreenS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bgGrad)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<rect width="1600" height="900" fill="url(#glowBg)"/>
<rect x="0" y="0" width="1600" height="6" fill="#F5A524"/>
<text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="3"><tspan x="80" y="72.0">BLOCKCHAIN ORACLE INTEGRATION</tspan></text>
<text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="80" y="122.0">Push vs pull oracle models</tspan></text>

<rect x="80" y="190" width="700" height="620" rx="20" fill="rgba(21,31,54,0.6)" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="112" y="240.0">Push-based feeds</tspan></text><rect x="112" y="272" width="636" height="82" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="134" y="303.1">Oracle network</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="134" y="331.9">Monitors the market off-chain</tspan></text><path d="M430,356 L430,374" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="112" y="376" width="636" height="82" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="134" y="407.1">Writes on heartbeat or deviation</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="134" y="435.9">e.g. every hour or on a 0.5% move</tspan></text><path d="M430,460 L430,478" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="112" y="480" width="636" height="82" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="134" y="511.1">On-chain feed contract</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="134" y="539.9">Always holds the latest value</tspan></text><path d="M430,564 L430,582" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="112" y="584" width="636" height="82" rx="14" fill="#1f2033" stroke="#F5A524" stroke-width="2" filter="url(#glow)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="134" y="615.1">Your contract reads it</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="134" y="643.9">Any caller, any time</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2"><tspan x="112" y="718.0">BEST FOR</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5F9" text-anchor="start"><tspan x="112" y="744.0">Lending, collateral valuation,</tspan><tspan x="112" y="764.5">stablecoins</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2"><tspan x="450" y="718.0">WATCH FOR</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5F9" text-anchor="start"><tspan x="450" y="744.0">Value can lag between updates;</tspan><tspan x="450" y="764.5">match staleness limits to the</tspan><tspan x="450" y="785.0">heartbeat</tspan></text><rect x="820" y="190" width="700" height="620" rx="20" fill="rgba(21,31,54,0.6)" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="852" y="240.0">Pull-based feeds</tspan></text><rect x="852" y="272" width="636" height="82" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="874" y="303.1">Signed updates off-chain</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="874" y="331.9">Streamed continuously, not stored on-chain</tspan></text><path d="M1170,356 L1170,374" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="852" y="376" width="636" height="82" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="874" y="407.1">Front end or keeper fetches</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="874" y="435.9">Gets the latest signed price</tspan></text><path d="M1170,460 L1170,478" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="852" y="480" width="636" height="82" rx="14" fill="#151f36" stroke="#2c3a5a" stroke-width="1.5"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="874" y="511.1">Included in the user's transaction</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="874" y="539.9">Update and action in one call</tspan></text><path d="M1170,564 L1170,582" stroke="#E8A33D" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="852" y="584" width="636" height="82" rx="14" fill="#1f2033" stroke="#F5A524" stroke-width="2" filter="url(#glow)"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#F1F5F9" text-anchor="start"><tspan x="874" y="615.1">Contract verifies, then uses</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="874" y="643.9">Signature and maximum age checked</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2"><tspan x="852" y="718.0">BEST FOR</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5F9" text-anchor="start"><tspan x="852" y="744.0">Perpetuals, options, DEXs,</tspan><tspan x="852" y="764.5">latency-sensitive trading</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2"><tspan x="1190" y="718.0">WATCH FOR</tspan></text><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5F9" text-anchor="start"><tspan x="1190" y="744.0">Clients must fetch updates; users</tspan><tspan x="1190" y="764.5">usually pay the update cost</tspan></text><circle cx="800" cy="500" r="30" fill="#0a1020" stroke="#F5A524" stroke-width="2"/><text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F5A524" text-anchor="middle"><tspan x="800" y="507.0">vs</tspan></text>
<g opacity="0.75">
  <rect x="1368" y="850" width="10" height="10" rx="2" fill="#F5A524"/>
  <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9" text-anchor="start"><tspan x="1386" y="860.0">ClickMasters</tspan></text>
  <text font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA8BF" text-anchor="start"><tspan x="1485" y="860.0">Blockchain</tspan></text>
</g>
</svg>